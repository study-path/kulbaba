<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 64 64">
  <defs>
    <!-- the app's meadow: warm orange melting into teal -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8862f"/>
      <stop offset="0.5" stop-color="#7a5a3e"/>
      <stop offset="1" stop-color="#3f7480"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e6" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#fff6e6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff6e6" stop-opacity="0"/>
    </radialGradient>
    <!-- one seed: beak and a tiny pappus at its tip -->
    <g id="ray" stroke="#fffaf0" stroke-linecap="round">
      <line x1="0" y1="-4.2" x2="0" y2="-13.2" stroke-width="1.1"/>
      <line x1="0" y1="-13.4" x2="-1.9" y2="-16" stroke-width="0.9"/>
      <line x1="0" y1="-13.4" x2="1.9" y2="-16" stroke-width="0.9"/>
      <line x1="0" y1="-13.4" x2="0" y2="-16.4" stroke-width="0.9"/>
    </g>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- stem -->
  <path d="M32 31 C 31 41, 34 49, 30.5 60" fill="none" stroke="#a9c96e" stroke-width="2.4" stroke-linecap="round"/>

  <!-- the seed head -->
  <g transform="translate(32 25)">
    <circle r="18" fill="url(#glow)"/>
    <use xlink:href="#ray" href="#ray"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(18)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(36)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(54)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(72)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(90)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(108)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(126)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(144)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(162)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(180)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(198)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(216)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(234)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(252)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(270)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(288)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(306)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(324)"/>
    <use xlink:href="#ray" href="#ray" transform="rotate(342)"/>
    <circle r="4.2" fill="#d99a3c"/>
    <circle r="2" fill="#f3c46a"/>
  </g>

  <!-- one seed already flying away -->
  <g transform="translate(53 11) rotate(18)" stroke="#fffaf0" stroke-linecap="round" fill="none">
    <line x1="0" y1="0" x2="0" y2="7" stroke-width="0.9"/>
    <path d="M-3.6 -1.4 L0 0 L3.6 -1.4 M-2.4 -3 L0 0 L2.4 -3 M0 -3.6 L0 0" stroke-width="0.8"/>
  </g>
</svg>
